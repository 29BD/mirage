[package]
name = "mirage"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive", "env"] }
google-ai-rs = { version = "0.3.0", features = [ "serde" ] }
serde = { version = "1.0.229", features = [ "derive" ] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time", "sync"] }
